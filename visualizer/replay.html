<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あかりの家 — E-MIDI REPLAY</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090614;color:#fff;font-family:system-ui,sans-serif;transition:background 1s}.card{width:min(760px,90vw);padding:28px;border:1px solid #ffffff33;border-radius:24px;background:#120b24cc;box-shadow:0 0 50px #b66cff33}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.v{padding:14px;border-radius:14px;background:#ffffff12;text-align:center}.n{font-size:28px;font-weight:800}button{border:0;border-radius:999px;padding:12px 18px;margin:5px;font-weight:800;cursor:pointer}.receipt{white-space:pre-wrap;background:#0006;padding:14px;border-radius:14px;font-family:ui-monospace,monospace;font-size:12px}</style></head>
<body><main class="card"><h1>🎵 あかりの家 — E-MIDI REPLAY</h1><p>昔つくった感情神経を、localhostも常駐サーバーも無しで再生する小さな標本。</p><div class="grid"><div class="v">VALENCE<div id="v" class="n"></div></div><div class="v">AROUSAL<div id="a" class="n"></div></div><div class="v">TENSION<div id="t" class="n"></div></div><div class="v">BOUNCE<div id="b" class="n"></div></div></div><div><button onclick="play(0)">🌙 静かな夜</button><button onclick="play(1)">🥁 ライブ</button><button onclick="play(2)">✨ 2045</button></div><h3>RECEIPT</h3><div id="r" class="receipt"></div></main><script>const events=[{id:'replay-night',valence:52,arousal:28,tension:24,bounce:false},{id:'replay-live',valence:105,arousal:116,tension:61,bounce:true},{id:'replay-2045',valence:92,arousal:72,tension:38,bounce:false}];function play(i){const e=events[i];v.textContent=e.valence;a.textContent=e.arousal;t.textContent=e.tension;b.textContent=e.bounce?'YES':'NO';const hue=220+e.valence/127*120,light=4+e.arousal/127*12;document.body.style.background=`radial-gradient(circle at 30% 30%,hsl(${hue} 70% ${light+8}%),hsl(230 45% ${light}%))`;r.textContent=JSON.stringify({schema:'e-midi-replay/v1',source:'AInoAKARI/e-midi',event:e,rendered_at:new Date().toISOString()},null,2)}play(0)</script></body></html>
